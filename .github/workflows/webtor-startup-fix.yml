name: Webtor targeted startup repair
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build pinned isolated image
        run: docker build --network=none --tag tmx-webtor:test .
      - name: Targeted startup repair and essential smoke
        run: python3 -u ci/startup_fix.py
