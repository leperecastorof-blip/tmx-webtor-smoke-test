name: Webtor real 30-minute endurance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  endurance:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build pinned isolated image
        run: docker build --network=none --tag tmx-webtor:test .
      - name: Real-time HLS endurance and controlled faults
        run: python3 -u ci/endurance.py
